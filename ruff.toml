# Ruff configuration for StitchGuard

line-length = 120
target-version = "py313"

[lint]
# Ignorar regras que causam muitos erros no código existente
ignore = [
    "E501",    # line too long (já tratado pelo line-length)
    "SIM114",  # if branches can be combined
    "C901",    # function too complex
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "TRY003",  # long exception message
    "EM101",   # exception must not use a string
    "EM102",   # exception must not use an f-string
    "I001",    # import sorting
    "F401",    # unused imports (re-exports)
    "E402",    # module level import not at top
    "F811",    # redefinition of unused name
    "F841",    # local variable assigned but never used
    "ARG001",  # unused function argument
    "ARG002",  # unused method argument
    "PLW0603", # global statement usage
    "S101",    # assert usage
    "S105",    # hardcoded password
    "S106",    # hardcoded password
    "S110",    # try-except-pass
    "UP017",   # use datetime.UTC alias
    "UP045",   # use X | None for type annotations
    "UP007",   # use X | Y for union types
    "UP032",   # use f-string instead of format
    "UP031",   # use f-string instead of % format
    "UP030",   # use f-string instead of format call
    "UP034",   # extraneous parentheses
    "UP015",   # unnecessary open mode parameters
    "UP018",   # unnecessary __str__ call
    "UP035",   # deprecated imports
    "UP038",   # isinstance check with union type
    "UP010",   # unnecessary __future__ import
    "UP009",   # UTF-8 encoding declaration is unnecessary
    "UP012",   # unnecessary call to encoded
    "UP025",   # remove unicode literal prefix
    "UP013",   # convert dict to use dict()
    "UP014",   # convert path to use Path
    "UP037",   # quotes are unnecessary
    "UP036",   # version block is outdated
    "UP039",   # unnecessary class call
    "UP040",   # unnecessary TypeAlias
    "UP043",   # unnecessary default type argument
    "UP044",   # unnecessary __slots__
    "UP046",   # unnecessary __init_subclass__ argument
    "UP047",   # unnecessary __init_subclass__ argument
