[lint.per-file-ignores]
# Ignorar em testes
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "F401", "S106"]
# Ignorar em scripts
"scripts/**/*.py" = ["T201", "S", "F401"]

[format]
quote-style = "double"
indent-style = "space"
