# Ruff configuration for StitchGuard

line-length = 120
target-version = "py313"

[lint]
ignore = [
    "E501",    # line too long
    "E402",    # module level import not at top
    "F401",    # unused imports (re-exports)
    "F541",    # f-string without placeholders
    "F811",    # redefinition of unused name
    "F841",    # local variable assigned but never used
    "SIM102",  # nested if can be combined
    "SIM114",  # if branches can be combined
    "C901",    # function too complex
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "PLR2004", # magic value used in comparison
    "PLW0603", # global statement usage
    "RUF010",  # use explicit conversion flag
    "RUF059",  # unpacked variable never used
    "ARG001",  # unused function argument
    "ARG002",  # unused method argument
    "S101",    # assert usage
    "S105",    # hardcoded password
    "S106",    # hardcoded password
    "S110",    # try-except-pass
    "B008",    # function call in argument defaults (FastAPI dependency)
    "ASYNC230",# async function opens file (FastAPI pattern)
    "BLE001",  # blind exception (try/except blocks)
    "TRY003",  # long exception message
    "EM101",   # exception must not use a string
    "EM102",   # exception must not use an f-string
    "I001",    # import sorting
    "T201",    # print found
]

# Permitir auto-fix
fixable = ["ALL"]
unfixable = []

[lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "F401", "S106"]
"scripts/**/*.py" = ["T201", "S", "F401"]

[format]
quote-style = "double"
indent-style = "space"
